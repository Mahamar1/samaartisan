<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" />

  <!-- Main Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge Base -->
    <path d="M256 90 L370 140 C370 250 256 340 256 340 C256 340 142 250 142 140 Z" fill="#ffffff" opacity="0.96" />
    
    <!-- Crossed Tools & Wrench -->
    <!-- Wrench -->
    <path d="M210 160 L240 190 L220 210 L190 180 C185 182 178 180 174 176 C168 170 168 160 174 154 C180 148 190 148 196 154 C200 158 202 165 210 160 Z" fill="#0284c7" />
    <path d="M220 210 L300 290 C306 296 316 296 322 290 C328 284 328 274 322 268 L242 188 Z" fill="#0369a1" />
    
    <!-- Hammer / Mallet -->
    <path d="M295 155 L335 195 L315 215 L275 175 Z" fill="url(#gold-grad)" />
    <path d="M285 185 L205 265 C199 271 189 271 183 265 C177 259 177 249 183 243 L263 163 Z" fill="#d97706" />

    <!-- Center Trust Star -->
    <polygon points="256,190 264,212 288,212 268,226 276,248 256,234 236,248 244,226 224,212 248,212" fill="#059669" />
  </g>

  <!-- Senegal Flag Accent Bar at Bottom -->
  <g transform="translate(156, 390)">
    <rect x="0" y="0" width="66" height="16" rx="4" fill="#16a34a" />
    <rect x="67" y="0" width="66" height="16" rx="4" fill="#eab308" />
    <rect x="134" y="0" width="66" height="16" rx="4" fill="#dc2626" />
    <!-- Small Green Star in Yellow Bar -->
    <polygon points="100,2 102,6 106,6 103,9 104,13 100,10 96,13 97,9 94,6 98,6" fill="#16a34a" />
  </g>

  <!-- Typography Brand text -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SAMA ARTISAN</text>
</svg>
